# Всё приложение одной командой: docker compose up --build
#   приложение -> http://localhost:8080, Mailpit (почта) -> http://localhost:8025
# Только инфраструктура для разработки (приложение запускается из IDE/dotnet run):
#   docker compose up -d postgres mailpit
# Значения по умолчанию — только для локальной работы; для развёртывания задайте их
# через .env (см. .env.example) или переменные окружения.
services:
  app:
    build:
      context: .
      dockerfile: Nimrata.Core.Server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=nimrata;Username=nimrata;Password=${POSTGRES_PASSWORD:-nimrata_dev}"
      Jwt__Key: ${JWT_KEY:-compose-dev-only-jwt-signing-key-change-me-0123456789}
      Admin__Email: ${ADMIN_EMAIL:-admin@nimrata.local}
      Admin__Password: ${ADMIN_PASSWORD:-dev-admin-password}
      Smtp__Host: mailpit
      Smtp__Port: "1025"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nimrata
      POSTGRES_USER: nimrata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nimrata_dev}
    ports:
      # Параметры совпадают с ConnectionStrings:Default в appsettings.Development.json.
      - "5433:5432"
    volumes:
      - nimrata-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimrata -d nimrata"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # веб-интерфейс
      - "1025:1025"   # SMTP

volumes:
  nimrata-pgdata:
